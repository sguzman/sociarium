[workspace]
resolver = "2"
members = [
  "crates/sociarium-core",
  "crates/sociarium-adapter",
  "crates/sociarium-adapter-x",
  "crates/sociarium-config",
  "crates/sociarium-credentials",
  "crates/sociarium-store",
  "crates/sociarium-sync",
  "crates/sociarium-search",
  "crates/sociarium-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/sguzman/sociarium"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
toml = "0.8"
url = "2"
