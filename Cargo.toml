[workspace]
resolver = "2"
members = [
  "crates/sociarium-core",
  "crates/sociarium-adapter",
  "crates/sociarium-adapter-x",
  "crates/sociarium-store",
  "crates/sociarium-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/sguzman/sociarium"

[workspace.dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
