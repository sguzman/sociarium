schema_version = 1

# Surface settings belong to the adapter, not to profiles or the core ontology.
# These values are not secrets. OAuth bearer/refresh tokens never belong here.
[surfaces.x]
client_id = "replace-with-x-developer-app-client-id"
redirect_uri = "http://127.0.0.1:49152/oauth/x/callback"

# Profiles are synchronization scopes, not inferred real-world people.
[[profiles]]
id = "x-main"
surface = "x"
handle = "sguzman"
ownership = "self_owned"
enabled = true

# Additional surfaces/profiles use the same generic shape.
# [surfaces.reddit]
# client_id = "example"
#
# [[profiles]]
# id = "reddit-main"
# surface = "reddit"
# handle = "example"
# ownership = "self_owned"
# enabled = false
