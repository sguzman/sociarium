name: materialize-lockfile

on:
  push:
    paths:
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - ".github/workflows/materialize-lockfile.yml"

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - run: cargo +1.85.0 generate-lockfile
      - run: cargo +1.85.0 check --workspace --all-targets --locked
      - name: Commit lockfile if needed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock && git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then
            echo "Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "materialize Rust 1.85-compatible Cargo.lock"
          git push origin HEAD:main
